name: Publish SurveyQuant Refund Policy, WhatsApp and 7-Day Trial
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Update pages
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          WA = "https://wa.me/201118980717"

          # Homepage and seven-day trial
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          for old, new in [
              ("فترة تجريبية مجانية لمدة 3 أيام", "فترة تجريبية مجانية لمدة 7 أيام"),
              ("3 أيام مجانية", "7 أيام مجانية"),
              ("مدتها 3 أيام", "مدتها 7 أيام"),
              ("مدة 3 أيام", "مدة 7 أيام"),
              ("لمدة ثلاثة أيام", "لمدة سبعة أيام"),
              ("مدتها ثلاثة أيام", "مدتها سبعة أيام"),
              ("الفترة التجريبية المعلنة مدتها 3 أيام", "الفترة التجريبية المعلنة مدتها 7 أيام"),
          ]:
              s = s.replace(old, new)

          # Main navigation only, avoiding the duplicate pricing link in footer.
          a = s.find('<nav class="navlinks" id="navlinks"')
          b = s.find("</nav>", a) if a >= 0 else -1
          if a < 0 or b < 0:
              raise SystemExit("ERROR: Main navigation was not found.")
          nav = s[a:b]
          if 'href="refund-policy.html"' not in nav:
              anchor = '<a href="#pricing">الأسعار</a>'
              if anchor not in nav:
                  raise SystemExit("ERROR: Pricing link not found inside main navigation.")
              nav = nav.replace(anchor, anchor + '<a href="refund-policy.html">سياسة الاسترجاع</a>', 1)
              s = s[:a] + nav + s[b:]

          # Pricing footnote
          if 'class="plan-foot"' in s and 'سياسة الاسترجاع عند فشل الدفع' not in s:
              s, n = re.subn(
                  r'(<p class="plan-foot"[^>]*>.*?</p>)',
                  lambda m: m.group(1)[:-4] + '<br><a href="refund-policy.html">سياسة الاسترجاع عند فشل الدفع أو عدم تفعيل الاشتراك</a> · <a href="' + WA + '" target="_blank" rel="noopener noreferrer">واتساب الدعم: 01118980717</a></p>',
                  s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit("ERROR: Could not add refund link below prices.")

          # Footer link
          fa = s.find('<nav class="footerlinks">')
          fb = s.find("</nav>", fa) if fa >= 0 else -1
          if fa >= 0 and fb >= 0:
              footer = s[fa:fb]
              if 'href="refund-policy.html"' not in footer:
                  footer = footer.replace('<a href="privacy-policy.html">سياسة الخصوصية</a>',
                                          '<a href="privacy-policy.html">سياسة الخصوصية</a><a href="refund-policy.html">سياسة الاسترجاع</a>', 1)
                  s = s[:fa] + footer + s[fb:]

          s = s.replace("الموقع لا يستقبل المدفوعات في الوقت الحالي. لا تعتبر أي عملية اشتراك مفعّلة إلا بعد تأكيد وسيلة الدفع الرسمية وإتمام التفعيل.</li>",
                        "الموقع لا يستقبل المدفوعات في الوقت الحالي. لا تعتبر أي عملية اشتراك مفعّلة إلا بعد تأكيد وسيلة الدفع الرسمية وإتمام التفعيل.</li><li>إذا خُصم مبلغ ولم تكتمل عملية الدفع أو لم يتم تفعيل الاشتراك بعد تأكيد الخصم، تتم مراجعة العملية وبدء إجراءات رد المبلغ المدفوع إلى وسيلة الدفع الأصلية وفق سياسة الاسترجاع.</li>")
          note = '<p class="muted">بوابة الدفع الإلكتروني غير مفعّلة حاليًا في الموقع. لا ترسل بيانات بطاقتك البنكية أو كلمات المرور عبر البريد.</p>'
          if note in s and WA not in s:
              s = s.replace(note, note + '<p><a href="' + WA + '" target="_blank" rel="noopener noreferrer">واتساب الدعم: 01118980717</a></p>', 1)
          p.write_text(s, encoding="utf-8")

          # Privacy policy: trim accidental trailing workflow text and update trial/contact/refund.
          p = Path("privacy-policy.html")
          if p.exists():
              s = p.read_text(encoding="utf-8")
              end = s.lower().find("</html>")
              if end >= 0:
                  s = s[:end + 7] + "\n"
              s = s.replace("12 أكتوبر 2026", "21 أكتوبر 2026").replace("13 أكتوبر 2026", "21 أكتوبر 2026")
              s = s.replace("فترة تجريبية مجانية لمدة 3 أيام", "فترة تجريبية مجانية لمدة 7 أيام")
              s = s.replace("فترة تجريبية لمدة ثلاثة أيام", "فترة تجريبية لمدة سبعة أيام")
              s = s.replace("مدة 3 أيام", "مدة 7 أيام").replace("مدة ثلاثة أيام", "مدة سبعة أيام")
              s = s.replace("01260019614", "01118980717").replace("+201260019614", "+201118980717")
              heading = "<h2>13. التواصل</h2>"
              if heading in s and "wa.me/201118980717" not in s:
                  s = s.replace(heading, heading + '<p><strong>واتساب:</strong> <a href="' + WA + '" target="_blank" rel="noopener noreferrer">01118980717</a></p>', 1)
              start = "<h2>10. سياسة الاسترجاع واسترداد المدفوعات</h2>"
              finish = "<h2>11. المدفوعات عبر الموقع والتطبيق</h2>"
              if start in s and finish in s:
                  before, rest = s.split(start, 1)
                  _, after = rest.split(finish, 1)
                  section = '<h2>10. سياسة الاسترجاع واسترداد المدفوعات</h2><div class="refund"><strong>إذا تم خصم المبلغ ولم تكتمل عملية الدفع أو لم يتم تفعيل الاشتراك بعد تأكيد الخصم، تتم مراجعة العملية وبدء إجراءات رد المبلغ المدفوع.</strong><p>بعد التحقق من حالة العملية لدى مزوّد الدفع، يتم بدء إجراءات إلغاء العملية أو رد المبلغ إلى وسيلة الدفع الأصلية بحسب الحالة وما يتيحه مزوّد الدفع. لا يحتاج المستخدم إلى شراء الاشتراك مرة أخرى قبل التحقق من العملية الأولى.</p><p>إذا لم يُخصم أي مبلغ أصلًا، فلا يوجد مبلغ مدفوع لاسترداده. قد يختلف وقت ظهور المبلغ المسترد حسب البنك ومزوّد الدفع. لمتابعة الحالة، تواصل عبر واتساب على الرقم 01118980717.</p></div>'
                  s = before + section + finish + after
              p.write_text(s, encoding="utf-8")

          # Standalone refund page
          refund_lines = [
            '<!doctype html>',
            '<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b2340"><title>سياسة الاسترجاع والدفع | SurveyQuant</title>',
            '<style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f3f6fa;color:#263445;line-height:1.9}header{background:#0b2340;color:#fff;text-align:center;padding:30px 16px}main{max-width:900px;margin:25px auto;padding:clamp(19px,4vw,32px);background:#fff;border-radius:14px}h2{color:#123b60;font-size:20px;margin-top:25px}a{color:#0877bd;overflow-wrap:anywhere}p{font-size:15px}.notice{background:#edf4fb;padding:14px 16px;border-radius:8px}.refund{background:#edf8f1;border-right:4px solid #24834b;padding:14px 18px;border-radius:8px}.btn{display:inline-block;background:#123b60;color:#fff;border-radius:9px;padding:10px 15px;text-decoration:none}footer{text-align:center;padding:20px;color:#64748b;font-size:14px}</style></head>',
            '<body><header><h1>سياسة الاسترجاع والدفع</h1><p>مكتب فني مساحة · SurveyQuant</p></header><main>',
            '<p class="notice"><strong>آخر تحديث:</strong> 21 أكتوبر 2026.</p>',
            '<h2>1. الفترة التجريبية المجانية</h2><p>الفترة التجريبية المجانية المعلنة لتطبيق SurveyQuant هي <strong>7 أيام</strong>. يجب التأكد من تفعيل الفترة وبدايتها داخل الإصدار المستخدم؛ عرض المدة على الموقع وحده لا يفعّل التجربة تلقائيًا داخل التطبيق.</p>',
            '<h2>2. متى يتم رد المبلغ؟</h2><div class="refund"><p><strong>إذا تم خصم مبلغ ولم تكتمل عملية الدفع أو لم يتم تفعيل الاشتراك بعد تأكيد الخصم، تتم مراجعة العملية وبدء إجراءات رد المبلغ المدفوع إلى وسيلة الدفع الأصلية.</strong></p><p>لا يحتاج المستخدم إلى شراء الاشتراك مرة ثانية قبل التحقق من حالة العملية الأولى. وإذا لم يتم خصم أي مبلغ، فلا يوجد مبلغ مدفوع لاسترداده.</p></div>',
            '<h2>3. مدة الاسترجاع</h2><p>بعد التحقق من حالة الدفع، يتم بدء إجراءات الإلغاء أو الاسترداد بحسب حالة العملية وما يتيحه مزوّد الدفع. قد يختلف وقت ظهور المبلغ حسب البنك ومزوّد الدفع، ولا يعني بدء الإجراء أن الرصيد سيظهر فورًا.</p>',
            '<h2>4. الدفع عبر الموقع</h2><p class="notice">الموقع التعريفي لا يستقبل المدفوعات الإلكترونية في الوقت الحالي. لا ترسل بيانات البطاقة كاملة أو رمز CVV أو كلمات المرور أو رموز التحقق عبر الهاتف أو البريد أو واتساب.</p>',
            '<h2>5. التواصل عبر واتساب</h2><p>لمتابعة عملية دفع أو طلب استرجاع، تواصل على الرقم <strong>01118980717</strong> واذكر تاريخ العملية وقيمتها ومرجع الطلب إن وجد. لا ترسل رقم البطاقة كاملًا أو رمز الأمان.</p>',
            '<p><a class="btn" href="https://wa.me/201118980717?text=%D9%85%D8%AA%D8%A7%D8%A8%D8%B9%D8%A9%20%D8%A7%D8%B3%D8%AA%D8%B1%D8%AC%D8%A7%D8%B9%20SurveyQuant" target="_blank" rel="noopener noreferrer">التواصل عبر واتساب</a></p>',
            '<p>البريد الإلكتروني: <a href="mailto:abo.abdalla72229@gmail.com">abo.abdalla72229@gmail.com</a></p><p><a class="btn" href="privacy-policy.html">سياسة الخصوصية</a> <a class="btn" href="./index.html">العودة إلى الموقع</a></p>',
            '</main><footer>© 2026 مكتب فني مساحة · SurveyQuant</footer></body></html>'
          ]
          Path("refund-policy.html").write_text("\n".join(refund_lines), encoding="utf-8")
          print("Updated homepage and privacy policy; created refund-policy.html.")
          PY
      - name: Validate pages
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s privacy-policy.html
          test -s refund-policy.html
          grep -q '7 أيام مجانية' index.html
          grep -q '01118980717' index.html
          grep -q '7 أيام' refund-policy.html
          grep -q 'wa.me/201118980717' refund-policy.html
          grep -q 'سياسة الاسترجاع' index.html
          git diff --check
      - name: Commit and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html privacy-policy.html refund-policy.html
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Publish 7-day trial and refund policy"
          git push
